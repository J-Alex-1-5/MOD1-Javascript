<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login con Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex justify-center items-center h-screen bg-gray-100">
    <div class="bg-white p-6 rounded-lg shadow-lg w-80">
        <h2 class="text-center text-xl font-semibold mb-4">Login</h2>
        <form>
            <div class="mb-4">
                <label for="email" class="block text-gray-700">Correo Electrónico</label>
                <input type="email" id="email" class="w-full p-2 border rounded mt-1" placeholder="Ingresa tu email">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700">Contraseña</label>
                <input type="password" id="password" class="w-full p-2 border rounded mt-1" placeholder="Ingresa tu contraseña">
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded">Ingresar</button>
        </form>
    </div>
</body>
</html>
